<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#FAF6F0"/>
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.35"/>
  <g transform="translate(2, 0)">
    <!-- Keystone Diamond -->
    <polygon points="36,13 40,18 36,23 32,18" fill="#C5A059"/>

    <!-- 'A' Structure in Deep Forest Green -->
    <!-- Left diagonal pillar of A -->
    <line x1="36" y1="22" x2="18" y2="76" stroke="#162A1E" stroke-width="6" stroke-linecap="round"/>
    <!-- Right diagonal pillar of A -->
    <line x1="36" y1="22" x2="54" y2="76" stroke="#162A1E" stroke-width="6" stroke-linecap="round"/>
    <!-- Shared crossbar of A -->
    <line x1="26" y1="53" x2="52" y2="53" stroke="#162A1E" stroke-width="5" stroke-linecap="round"/>

    <!-- 'E' Structure in Champagne Gold -->
    <!-- Vertical stem of E -->
    <line x1="54" y1="30" x2="54" y2="76" stroke="#C5A059" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Top arm of E -->
    <line x1="54" y1="31" x2="78" y2="31" stroke="#C5A059" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Middle arm of E -->
    <line x1="50" y1="53" x2="74" y2="53" stroke="#C5A059" stroke-width="5" stroke-linecap="round"/>
    <!-- Bottom arm of E -->
    <line x1="54" y1="76" x2="78" y2="76" stroke="#C5A059" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Architectural Plinth Foundation -->
    <line x1="12" y1="83" x2="82" y2="83" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
